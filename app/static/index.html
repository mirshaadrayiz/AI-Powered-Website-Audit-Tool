<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Powered Website Audit Tool</title>
<style>
  :root {
    --ink: #1c2126;
    --muted: #5b6572;
    --border: #dde2e8;
    --bg: #f7f8fa;
    --card: #ffffff;
    --metrics-accent: #4b5563;
    --insights-accent: #2563eb;
    --reco-accent: #b45309;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 0.35rem;
  }
  header p {
    color: var(--muted);
    margin: 0 0 1.75rem;
    font-size: 0.95rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  input[type="url"] {
    flex: 1;
    padding: 0.65rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input[type="url"]:focus {
    outline: 2px solid var(--insights-accent);
    outline-offset: 1px;
  }
  button {
    padding: 0.65rem 1.25rem;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    display: none;
    align-items: center;
    gap: 0.6rem;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  #status.visible { display: flex; }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--insights-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    display: none;
    background: #fdecea;
    border: 1px solid #f3c2bd;
    color: var(--error);
    padding: 0.85rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  #error.visible { display: block; }

  section.card {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.25rem;
  }
  section.card.visible { display: block; }
  section.card h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 2px solid var(--section-accent);
    color: var(--section-accent);
  }
  #metrics-card { --section-accent: var(--metrics-accent); }
  #insights-card { --section-accent: var(--insights-accent); }
  #recommendations-card { --section-accent: var(--reco-accent); }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem 1.5rem;
    font-size: 0.9rem;
  }
  .metrics-grid .label { color: var(--muted); }
  .metrics-grid .value { font-weight: 600; }
  .metrics-grid .full-row { grid-column: 1 / -1; }
  .sequence {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
    color: var(--muted);
    word-break: break-word;
  }

  .insight-block { margin-bottom: 1.1rem; }
  .insight-block:last-child { margin-bottom: 0; }
  .insight-block h3 {
    font-size: 0.85rem;
    margin: 0 0 0.3rem;
  }
  .insight-block p {
    margin: 0;
    font-size: 0.92rem;
    color: #333;
  }
  .insight-citations {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 0.35rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  ol.reco-list {
    margin: 0;
    padding-left: 1.25rem;
  }
  ol.reco-list li { margin-bottom: 1rem; }
  ol.reco-list li:last-child { margin-bottom: 0; }
  .reco-action { font-weight: 600; font-size: 0.95rem; }
  .reco-reasoning { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI-Powered Website Audit Tool</h1>
    <p>Enter a URL to extract factual page metrics and generate grounded SEO/UX insights and recommendations.</p>
  </header>

  <form id="audit-form">
    <input type="url" id="url-input" placeholder="https://example.com" required>
    <button type="submit" id="submit-btn">Audit</button>
  </form>

  <div id="status"><span class="spinner"></span><span>Scraping the page and running AI analysis — this can take up to 15 seconds…</span></div>
  <div id="error"></div>

  <section class="card" id="metrics-card">
    <h2>Factual Metrics</h2>
    <div class="metrics-grid" id="metrics-grid"></div>
  </section>

  <section class="card" id="insights-card">
    <h2>AI Insights</h2>
    <div id="insights-body"></div>
  </section>

  <section class="card" id="recommendations-card">
    <h2>Recommendations</h2>
    <ol class="reco-list" id="reco-list"></ol>
  </section>
</main>

<script>
const form = document.getElementById("audit-form");
const urlInput = document.getElementById("url-input");
const submitBtn = document.getElementById("submit-btn");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const metricsCard = document.getElementById("metrics-card");
const insightsCard = document.getElementById("insights-card");
const recoCard = document.getElementById("recommendations-card");

const INSIGHT_LABELS = {
  seo_structure: "SEO Structure",
  messaging_clarity: "Messaging Clarity",
  cta_usage: "CTA Usage",
  content_depth: "Content Depth",
  ux_concerns: "UX Concerns",
  structural_concerns: "Structural Concerns",
};

function setLoading(isLoading) {
  submitBtn.disabled = isLoading;
  statusEl.classList.toggle("visible", isLoading);
}

function showError(message) {
  errorEl.textContent = message;
  errorEl.classList.add("visible");
}

function hideResultsAndError() {
  errorEl.classList.remove("visible");
  metricsCard.classList.remove("visible");
  insightsCard.classList.remove("visible");
  recoCard.classList.remove("visible");
}

function renderMetrics(metrics) {
  const grid = document.getElementById("metrics-grid");
  grid.innerHTML = "";

  const rows = [
    ["Total word count", metrics.total_word_count],
    ["Headings (H1 / H2 / H3)", `${metrics.heading_counts.h1_count} / ${metrics.heading_counts.h2_count} / ${metrics.heading_counts.h3_count}`],
    ["CTAs", metrics.ctas_count],
    ["Internal links", `${metrics.internal_links_count} (${metrics.unique_internal_links_count} unique)`],
    ["External links", `${metrics.external_links_count} (${metrics.unique_external_links_count} unique)`],
    ["Images", metrics.image_count],
    ["Images missing alt text", metrics.image_missing_alt_count],
    ["Images with decorative alt (alt=\"\")", metrics.image_decorative_alt_count],
    ["Meta title", metrics.meta_title || "(missing)"],
    ["Meta description", metrics.meta_description || "(missing)"],
  ];

  for (const [label, value] of rows) {
    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = label;
    const valueEl = document.createElement("div");
    valueEl.className = "value";
    valueEl.textContent = value;
    grid.append(labelEl, valueEl);
  }

  const seqLabel = document.createElement("div");
  seqLabel.className = "label full-row";
  seqLabel.textContent = "Heading sequence";
  const seqValue = document.createElement("div");
  seqValue.className = "value full-row sequence";
  seqValue.textContent = metrics.heading_counts.sequence.length
    ? metrics.heading_counts.sequence.join(" → ")
    : "(none)";
  grid.append(seqLabel, seqValue);

  metricsCard.classList.add("visible");
}

function renderInsights(insights) {
  const body = document.getElementById("insights-body");
  body.innerHTML = "";

  for (const [key, label] of Object.entries(INSIGHT_LABELS)) {
    const block = document.createElement("div");
    block.className = "insight-block";
    const h3 = document.createElement("h3");
    h3.textContent = label;
    const p = document.createElement("p");
    p.textContent = insights[key].analysis;
    block.append(h3, p);

    const cited = insights[key].metrics_cited;
    if (cited && cited.length) {
      const citations = document.createElement("div");
      citations.className = "insight-citations";
      citations.textContent = `Based on: ${cited.join(", ")}`;
      block.append(citations);
    }

    body.append(block);
  }

  insightsCard.classList.add("visible");
}

function renderRecommendations(recommendations) {
  const list = document.getElementById("reco-list");
  list.innerHTML = "";

  for (const item of recommendations.recommendation) {
    const li = document.createElement("li");
    const action = document.createElement("div");
    action.className = "reco-action";
    action.textContent = item.recommendation;
    const reasoning = document.createElement("div");
    reasoning.className = "reco-reasoning";
    reasoning.textContent = item.reasoning;
    li.append(action, reasoning);
    list.append(li);
  }

  recoCard.classList.add("visible");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  hideResultsAndError();
  setLoading(true);

  try {
    const response = await fetch("/audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: urlInput.value }),
    });

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      const detail = data && data.detail ? data.detail : `Request failed with status ${response.status}`;
      showError(detail);
      return;
    }

    renderMetrics(data.factual_metrics);
    renderInsights(data.insights);
    renderRecommendations(data.recommendations);
  } catch (err) {
    showError("Couldn't reach the server. Check your connection and try again.");
  } finally {
    setLoading(false);
  }
});
</script>
</body>
</html>
